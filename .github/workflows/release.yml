name: Release

# Publishes GitHub Release binaries only after the release gate passes.
# Tag format: vMAJOR.MINOR.PATCH

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml

  release-binaries:
    name: Build and publish release binaries
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: og-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: og-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: og-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable as of 2026-11-12
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Configure aivcs registry token
        env:
          AIVCS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRIES_AIVCS_TOKEN }}
        run: |
          test -n "${AIVCS_REGISTRY_TOKEN}"
          mkdir -p ~/.cargo
          printf '[registries.aivcs]\ntoken = "%s"\n' "$AIVCS_REGISTRY_TOKEN" >> ~/.cargo/credentials.toml

      - name: Build release binary
        env:
          CARGO_REGISTRIES_AIVCS_TOKEN: ${{ secrets.CARGO_REGISTRIES_AIVCS_TOKEN }}
        run: cargo build --release -p og-cli --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          install -Dm755 target/${{ matrix.target }}/release/og "${{ matrix.artifact }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
