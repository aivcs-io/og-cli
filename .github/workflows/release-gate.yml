name: Release Gate

# Mandatory security + privacy scan before any merge or tag release.
# Fails closed — no release artifacts publish unless this workflow passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Use the free gitleaks CLI directly. gitleaks/gitleaks-action@v2
      # requires a paid GITLEAKS_LICENSE on organization repositories.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tgz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect --source . --verbose --redact

  privacy-scan:
    name: Privacy / infrastructure leak scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fail on private infrastructure patterns
        run: |
          set -euo pipefail
          if rg -n --pcre2 \
            '/Users/[A-Za-z0-9._-]+' \
            'cluster\.local' \
            'gcr\.io/' \
            '177559565127\.dkr\.ecr' \
            'gcp-lornu' \
            'lornu-gke' \
            'aivcs-builds' \
            'agent-orchestrate-ai' \
            'aivcsd\.aivcs\.io' \
            '@lornu\.ai' \
            'lornu-ai' \
            'sandlot' \
            'sandlot\.uk' \
            'gho_[A-Za-z0-9]{20,}' \
            'ghp_[A-Za-z0-9]{20,}' \
            'AKIA[0-9A-Z]{16}' \
            '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE' \
            crates LICENSE README.md GEMINI.md Cargo.toml flake.nix .code-governance.toml \
            ; then
            echo "privacy-scan: forbidden pattern(s) found — see matches above"
            exit 1
          fi
          echo "privacy-scan: clean"

  build-check:
    name: Cargo check (registry token required)
    runs-on: ubuntu-latest
    needs: [secret-scan, privacy-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable as of 2026-11-12

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Configure aivcs registry token
        env:
          AIVCS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRIES_AIVCS_TOKEN }}
        run: |
          if [ -z "${AIVCS_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRIES_AIVCS_TOKEN secret not configured — skipping cargo check"
            exit 0
          fi
          mkdir -p ~/.cargo
          printf '[registries.aivcs]\ntoken = "%s"\n' "$AIVCS_REGISTRY_TOKEN" >> ~/.cargo/credentials.toml

      - name: Cargo check
        env:
          CARGO_REGISTRIES_AIVCS_TOKEN: ${{ secrets.CARGO_REGISTRIES_AIVCS_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRIES_AIVCS_TOKEN:-}" ]; then
            echo "Skipping cargo check (no registry token)"
            exit 0
          fi
          cargo check -p og-cli --all-targets

      - name: Cargo test
        env:
          CARGO_REGISTRIES_AIVCS_TOKEN: ${{ secrets.CARGO_REGISTRIES_AIVCS_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRIES_AIVCS_TOKEN:-}" ]; then
            echo "Skipping cargo test (no registry token)"
            exit 0
          fi
          cargo test -p og-cli --no-fail-fast
