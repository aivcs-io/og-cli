# .code-governance.toml — og-cli public adoption manifest

[governance]
source = "https://github.com/aivcs-io/code-governance"
ref = "main"

[adoption]
standards = [
  "github-repository-baseline",
  "ci-enforcement-baseline",
  "rust-project-baseline",
]

[ci]
required_checks = [
  "release-gate",
  "cargo-test",
]

[references]
readme_blurb = "Release-gated public mirror of the sovereign og-cli forge tree."
